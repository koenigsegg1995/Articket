<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員註冊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
	<th:block th:replace="~{fragments/head :: commonCss}"></th:block>
    <style>
        body {
            background-color: #f2e1e1;
        }

        .container {
            max-width: 800px;
            margin-top: 50px;
            margin-bottom: 50px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 50px;
            font-weight: bolder;
        }

        .custom-btn {
            background-color: rgb(243, 121, 142);
            /* 自定義顏色 */
            color: white;
            /* 字體顏色 */
            margin-top: 50px;
            width: 10%;
        }

        .form-group {
            font-size: 20px;
        }
    </style>
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>

	<div class="container">
		<div class="text-center">
			<h1>會員註冊</h1>
		</div>
		<form th:action="@{/generalmember/register}" method="post"
			  th:object="${generalMember}" enctype="multipart/form-data">
			<div class="form-group">
				<label for="memberAccount">
					帳號(電子信箱):
				</label>
				<input id="memberAccount"
					   type="text"
					   class="form-control" th:field="*{memberAccount}"
					   onclick="hideContent('memberAccount.errors');">
				<span th:if="${#fields.hasErrors('memberAccount')}"
					  th:errors="*{memberAccount}" class="error"
					  id="memberAccount.errors"></span>
			</div>
			<div class="form-group">
				<label for="password">
					密碼:
				</label>
				<input id="password"
					   type="password"
					   class="form-control" th:field="*{memberPassword}"
					   onclick="hideContent('memberPassword.errors');">
				<span th:if="${#fields.hasErrors('memberPassword')}"
					  th:errors="*{memberPassword}" class="error"
					  id="memberPassword.errors"></span>
			</div>
			<div class="form-group">
				<label for="name">
					姓名:
				</label>
				<input id="name"
					   type="text"
					   class="form-control" th:field="*{memberName}"
					   onclick="hideContent('memberName.errors');">
				<span th:if="${#fields.hasErrors('memberName')}"
					  th:errors="*{memberName}" class="error" id="memberName.errors"></span>
			</div>
			<div class="form-group">
				<label for="phone">
					電話:
				</label>
				<input id="phone"
					   type="text"
					   class="form-control" th:field="*{memberPhone}"
					   onclick="hideContent('memberPhone.errors');">
				<span th:if="${#fields.hasErrors('memberPhone')}"
					  th:errors="*{memberPhone}" class="error" id="memberPhone.errors"></span>
			</div>
			<div class="form-group">
				<label for="nickName">
					暱稱:
				</label>
				<input id="nickName"
					   type="text"
					   class="form-control" th:field="*{memberNickName}"
					   onclick="hideContent('memberNickName.errors');">
				<span th:if="${#fields.hasErrors('memberNickName')}"
					  th:errors="*{memberNickName}" class="error"
					  id="memberNickName.errors"></span>
			</div>
			<div class="form-group">
				<label for="address">
					地址:
				</label>
				<input id="address"
					   type="text"
					   class="form-control" th:field="*{memberAddress}"
					   onclick="hideContent('memberAddress.errors');">
				<span th:if="${#fields.hasErrors('memberAddress')}"
					  th:errors="*{memberAddress}" class="error"
					  id="memberAddress.errors"></span>
			</div>
			<div class="form-group">
				<label for="nationalId">
					身分證字號:
				</label>
				<input id="nationalId"
					   type="text"
					   class="form-control" th:field="*{nationalId}"
					   onclick="hideContent('nationalId.errors');">
				<span th:if="${#fields.hasErrors('nationalId')}"
					  th:errors="*{nationalId}" class="error" id="nationalId.errors"></span>
			</div>
			<div class="form-group">
				性別:
				<div>
					<label for="male" class="form-control">
						男
					</label>
					<input id="male"
						   type="radio" value="男"
						   th:field="*{gender}" onclick="hideContent('gender.errors');">

					<label for="female" class="form-control">
						女
					</label>
					<input id="female"
						   type="radio" value="女"
						   th:field="*{gender}"
						   onclick="hideContent('gender.errors');">

					<span th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"
						  class="error" id="gender.errors"></span>
				</div>
			</div>
			<div class="form-group">
				<label for="birthday">
					生日:
				</label>
				<input id="birthday"
					   type="date"
					   th:field="*{birthday}" onclick="hideContent('birthday.errors');">
				<span th:if="${#fields.hasErrors('birthday')}"
					  th:errors="*{birthday}" class="error" id="birthday.errors"></span>
			</div>
			<div>
				<label>
					照片:
				</label>
				<input type="file" th:field="*{memberPicture}"
					   onclick="previewImage()" multiple="multiple"
					   onchange="hideContent('memberPicture.errors');"/>
				<!-- 			<span  th:if="${#fields.hasErrors('memberPicture')}" th:errors="*{memberPicture}" class="error" id="memberPicture.errors"></span> -->
				<span class="error" th:utext="${errorMessage}"
					  id="memberPicture.errors">
					${errorMessage}
				</span>
				<!-- 			<h2 id="errorMessage">${errorMessage}</h2>  -->
				<div id="blob_holder"></div>
			</div>
			<button type="submit" class="custom-btn">
				確認送出
			</button>
		</form>
	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<script>
		var swiper = new Swiper('.swiper-container', {
			loop: true,
			autoplay: {
				delay: 3000,
			},
			pagination: {
				el: '.swiper-pagination',
				clickable: true,
			},
		});
	</script>

	<!-- JavaScript part -->
	<script type="text/javascript">
		//清除提示信息
		function hideContent(d) {
			document.getElementById(d).style.display = "none";
		}

		//照片上傳-預覽用
		var filereader_support = typeof FileReader != 'undefined';
		if (!filereader_support) {
			alert("No FileReader support");
		}
		acceptedTypes = {
			'image/png': true,
			'image/jpeg': true,
			'image/gif': true
		};

		function previewImage() {
			var upfile1 = document.getElementById("memberPicture");
			upfile1.addEventListener("change", function (event) {
				var files = event.target.files || event.dataTransfer.files;
				for (var i = 0; i < files.length; i++) {
					previewfile(files[i])
				}
			}, false);
		}

		function previewfile(file) {
			if (filereader_support === true && acceptedTypes[file.type] === true) {
				var reader = new FileReader();
				reader.onload = function (event) {
					var image = new Image();
					image.src = event.target.result;
					image.width = 100;
					image.height = 75;
					image.border = 2;
					if (blob_holder.hasChildNodes()) {
						blob_holder.removeChild(blob_holder.childNodes[0]);
					}
					blob_holder.appendChild(image);
				};
				reader.readAsDataURL(file);
				document.getElementById('submit').disabled = false;
			} else {
				blob_holder.innerHTML = "<div  style='text-align: left;'>" + "● filename: " + file.name
					+ "<br>" + "● ContentTyp: " + file.type
					+ "<br>" + "● size: " + file.size + "bytes"
					+ "<br>" + "● 上傳ContentType限制: <b> <font color=red>image/png、image/jpeg、image/gif </font></b></div>";
				document.getElementById('submit').disabled = true;
			}
		}
	</script>
	<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
