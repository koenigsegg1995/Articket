<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藝票人</title>
    <link rel="icon" href="/images/icon.ico">

    <!-- 共用 CSS（Font Awesome、字型、header_footer.css） -->
    <th:block th:replace="~{fragments/head :: commonCss}"></th:block>
    <link rel="stylesheet" href="/index.css">

    <!-- 本頁專用 -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
        }

        .content {
            flex: 1;
            padding: 20px;
            padding-bottom: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            margin: -10px -10px 40px -10px;
        }

        .col {
            padding: 10px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .row-cols-md-3 > .col {
                width: calc(33.333% - 20px);
            }
        }

        .card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .image-wrapper {
            position: relative;
            padding-top: 75%;
            overflow: hidden;
        }

        .image-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .image-slider img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-title {
            margin: 10px 0;
            font-size: 1.2em;
            font-weight: bold;
        }

        .card-text {
            margin: 5px 0;
            color: #666;
        }

        a {
            color: black;
            text-decoration: none;
        }

        .swiper-container {
            width: 100%;
            height: 400px;
            margin: 10px 0;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
        }

        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .swiper-pagination {
            position: relative;
            margin-top: 10px;
        }

        #activityDisplay {
            text-align: center;
            margin: 30px 0 20px 0;
        }

        @media (max-width: 480px) {
            .swiper-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="swiper-container">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="images/slideMagazine.jpg" alt="Slide 1"></div>
            <div class="swiper-slide"><img src="images/slideSherk.jpg" alt="Slide 2"></div>
            <div class="swiper-slide"><img src="images/slideSWIH.jpg" alt="Slide 3"></div>
            <div class="swiper-slide"><img src="images/slideAwakening_.jpg" alt="Slide 4"></div>
            <div class="swiper-slide"><img src="images/slideDontCry.jpg" alt="Slide 5"></div>
        </div>
    </div>
    <div class="swiper-pagination"></div>

    <!-- 活動行事曆（未實作，暫時保留）
    <a>
        <span>活動行事曆</span>
    </a>
    <div class="content">
        <div class="calendar">
            <select id="year-select"></select>
            <select id="month-select"></select>
            <table>
                <thead>
                    <tr>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Saturday</th>
                        <th>Sunday</th>
                    </tr>
                </thead>
                <tbody id="calendar-body"></tbody>
            </table>
        </div>
    </div>
    -->

    <div class="content">
        <h3 id="activityDisplay"><b>最新節目資訊</b></h3>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="activity : ${activityListData}">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <a th:href="@{activity/activityInfoOne(activityId=${activity.activityId})}"
                           class="text-decoration-none text-dark flex-grow-1 d-flex flex-column">
                            <div class="image-wrapper mb-3" style="height: 200px; overflow: hidden;">
                                <div class="image-slider" style="display: flex; transition: transform 0.5s ease-in-out;">
                                    <img th:each="activityPictureId : ${activityPictureIdList}"
                                         th:src="@{|/activity/DBGifReader?activityPictureId=${activityPictureId}|}"
                                         class="img-fluid" alt="Activity Image"
                                         style="object-fit: cover; width: 100%; height: 200px;">
                                </div>
                            </div>
                            <h5 class="card-title" th:text="${activity.activityName}"></h5>
                            <p class="card-text" th:text="'日期：' + ${activity.sellTime}"></p>
                            <p class="card-text" th:text="'地點：' + ${activity.venueName}"></p>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script>
        var swiper = new Swiper('.swiper-container', {
            loop: true,
            autoplay: {
                delay: 3000,
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
        });

        /* ===== 活動行事曆（未實作，待對應 HTML 啟用後解除註解） =====
        function generateCalendar(year, month) {
            const calendarBody = document.getElementById('calendar-body');
            calendarBody.innerHTML = '';

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            let date = 1;

            for (let i = 0; i < 6; i++) {
                const row = document.createElement('tr');

                for (let j = 0; j < 7; j++) {
                    const cell = document.createElement('td');
                    if (i === 0 && j < firstDay) {
                        cell.textContent = '';
                    } else if (date > lastDate) {
                        cell.textContent = '';
                    } else {
                        cell.textContent = `${month + 1}/${date}`;
                        date++;
                    }
                    row.appendChild(cell);
                }
                calendarBody.appendChild(row);
            }
        }

        const yearSelect = document.getElementById('year-select');
        const monthSelect = document.getElementById('month-select');
        const currentYear = new Date().getFullYear();

        for (let i = currentYear - 5; i <= currentYear + 5; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = i;
            yearSelect.appendChild(option);
        }

        for (let i = 0; i < 12; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = i + 1;
            monthSelect.appendChild(option);
        }

        yearSelect.value = currentYear;
        monthSelect.value = new Date().getMonth();

        generateCalendar(currentYear, new Date().getMonth());

        yearSelect.addEventListener('change', () => {
            generateCalendar(parseInt(yearSelect.value), parseInt(monthSelect.value));
        });

        monthSelect.addEventListener('change', () => {
            generateCalendar(parseInt(yearSelect.value), parseInt(monthSelect.value));
        });
        ========================================================== */
    </script>
</body>
</html>
