<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="header" class="header">
    <div class="top-bar">
        <div class="logo">
            <a th:href="@{/}">
                <img th:src="@{/images/logo.png}" alt="Logo">
            </a>
        </div>
        <div class="search-container">
            <div class="icons">
                <a href="/cart/view"><i class="fas fa-shopping-cart"></i> 購物車</a>
                <nav>
                    <div class="nav-container">
                        <span th:if="${session.memberName == null}">
                            <a th:href="@{/generalmember/login}">登入</a>
                        </span>
                        <span th:if="${session.memberName == null}">
                            <a th:href="@{/generalmember/register}">註冊</a>
                        </span>
                        <span th:if="${session.memberName != null}">
                            <a th:href="@{/generalmember/memberCenter}">會員中心</a>
                        </span>
                        <span th:if="${session.memberName != null}">
                            <a th:href="@{/generalmember/logout}">登出</a>
                        </span>
                    </div>
                </nav>
            </div>
        </div>
    </div>
    <nav class="navbar">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="/news/allNews">最新消息</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/activity/activityInfoAll}">活動資訊</a></li>
            <li class="nav-item"><a class="nav-link" href="/ticketInfo">票務須知</a></li>
            <li class="nav-item"><a class="nav-link" href="/venue/venueIntroduction">場館介紹</a></li>
            <li class="nav-item"><a class="nav-link" href="/article/forum">社群空間</a></li>
            <li class="nav-item"><a class="nav-link" href="/commodity/mall_activity">購物商城</a></li>
            <li class="nav-item"><a class="nav-link" href="/qa">常見問題</a></li>
        </ul>
    </nav>
</div>

</body>
</html>
