<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/images/icon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動商品列表</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <th:block th:replace="~{fragments/head :: commonCss}"></th:block>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        .content {
            padding: 20px;
        }

        .button-container {
            margin-top: 10px;
        }

        .product-grid {
            display: flex;
			flex-wrap: wrap;
			justify-content: center;
            gap: 20px;
        }

        .product-card {
			width: 300px;
			flex: 0 0 auto;
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .product-image {
			width: 100%;
			height: 250px;
			object-fit: cover;
			margin-bottom: 10px;
        }

        .product-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card h3 {
            font-size: 18px;
            margin: 5px 0;
        }

        .product-card .price {
            font-size: 16px;
            color: black;
            margin: 5px 0;
        }

        .product-card .description {
            font-size: 14px;
            color: #555;
            margin: 5px 0;
        }

        .product-card .add-to-cart,
		.product-card .buy-now{
			display: block;          /* 統一成 block */
			width: 100%;
			padding: 10px 20px;      /* 一樣的 padding */
			font-family: inherit;    /* 一樣的字型 */
			font-size: 16px;         /* 一樣的字級 */
			line-height: 1.5;        /* 一樣的行高 */
			box-sizing: border-box;  /* 一樣的盒模型 */
			text-align: center;
			background-color: #e4d1ba;
			color: #fff;
			border: none;
			text-decoration: none;
			cursor: pointer;
        }

        /* 加入購物車 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 300px;
            text-align: center;
            border-radius: 5px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover, .close:focus {
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }

        /*	分頁*/
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            font-family: Arial, sans-serif;
        }

        .pagination a, .pagination span {
            color: #333;
            padding: 8px 16px;
            text-decoration: none;
            transition: background-color 0.3s, color 0.3s;
            border: 1px solid #ddd;
            margin: 0 4px;
            border-radius: 5px;
        }

        .pagination {
            background-color: #e4d1ba;
            color: white;
            border: 1px solid #4a69bd;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
    </style>
</head>
<body>
	<div th:replace="~{fragments/header :: header}"></div>

	<div class="content">
		<div id="cartModal" class="modal">
			<div class="modal-content">
				<span class="close">&times;</span>
				<p>商品已成功加入購物車！</p>
			</div>
		</div>

		<div class="product-grid">
			<div th:each="commodity : ${commodityList}" class="product-card">
				<a th:href="@{/commodity/mall_listOneCommodity(commodityId=${commodity.commodityId})}" style="margin-bottom: 0;">
					<img th:src="@{/commodity/DBGifReaderByCommodityId(commodityId=${commodity.commodityId})}" alt="商品圖片" class="product-image">
				</a>

				<div class="product-info">
					<h3 th:text="${commodity.activityName}">活動名稱</h3>
					<p class="price" th:text="${'$' + commodity.commodityPrice}">價格</p>
					<p class="description" th:text="${commodity.commodityName}">商品名稱</p>
					<div class="button-container">
						<button onclick="addToCart(this)" th:data-id="${commodity.commodityId}" class="add-to-cart">
							加入購物車
						</button>
						<a th:href="@{'/cart/add?commodityId=' + ${commodity.commodityId} + '&quantity=1&redirect=checkout'}" class="buy-now">
							直接購買
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="pagination" th:if="${totalPages > 1}">
		<span th:text="'第 ' + ${currentPage} + ' 頁，共 ' + ${totalPages} + ' 頁'"></span>
		<a th:if="${currentPage > 1}"
		   th:href="@{'/commodity/mall_listActivityCommodities'(page=${currentPage - 1}, activityId=${activityId})}">
			上一頁
		</a>
		<a th:if="${currentPage < totalPages}"
		   th:href="@{'/commodity/mall_listActivityCommodities'(page=${currentPage + 1}, activityId=${activityId})}">
			下一頁
		</a>
	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<script>
		document.addEventListener('DOMContentLoaded', function () {
			let modal = document.getElementById("cartModal");
			let closeBtn = document.querySelector('.close');

			// 處理加入購物車的邏輯
			document.querySelectorAll('.add-to-cart').forEach(button => {
				button.addEventListener('click', function (event) {
					event.preventDefault();
					let commodityId = this.getAttribute('data-id');

					fetch('/cart/addAjax', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/x-www-form-urlencoded',
						},
						body: 'commodityId=' + commodityId + '&quantity=1'
					}).then(response => {
						if (response.status === 401) {
							// 未登入 → 前端跳轉登入頁
							alert('請先登入帳號');
							window.location.href = '/generalmember/login';

							return;
						}

						return response.text();
					}).then(data => {
						if(data) {
							document.getElementById('modalMessage').innerText = data;
							modal.style.display = "block";
						}
					}).catch((error) => {
						console.error('Error:', error);
					});
				});
			});

			// 關閉模態框的邏輯
			closeBtn.addEventListener('click', function () {
				modal.style.display = "none";
			});

			// 當用戶點擊模態框外的任何地方，關閉它
			window.addEventListener('click', function (event) {
				if (event.target === modal) {
					modal.style.display = "none";
				}
			});
		});
	</script>

	<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
</body>
</html>
