<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/images/icon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藝票人商城</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css"/>
    <th:block th:replace="~{fragments/head :: commonCss}"></th:block>
    <style>
        .activity-card {
            width: 300px;
            flex: 0 0 auto;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .activity-image {
            width: 100%;
            height: 350px;
            object-fit: contain;
        }

        .activity-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .activity-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .activity-card a {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        /*	分頁*/
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            font-family: Arial, sans-serif;
        }

        .pagination a, .pagination span {
            color: #333;
            padding: 8px 16px;
            text-decoration: none;
            transition: background-color 0.3s, color 0.3s;
            border: 1px solid #ddd;
            margin: 0 4px;
            border-radius: 5px;
        }

        .pagination a:hover:not(.disabled) {
            background-color: #e57373;
            color: white;
        }

        .pagination .active {
            background-color: #e57373;
            color: white;
            border: 1px solid #4a69bd;
        }

        .pagination .disabled {
            color: #ddd;
            pointer-events: none;
            background-color: #f8f8f8;
        }

        .action-cell {
            padding: 10px;
            text-align: center;
        }

        .action-form {
            margin: 0;
            display: inline-block;
        }

        .action-button {
            background-color: #e57373;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .action-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="content">
        <div class="activity-grid">
            <div th:each="activity : ${activityList}" class="activity-card">
                <a th:href="@{/commodity/mall_listActivityCommodities(activityId=${activity.activityId})}">
                    <img th:src="@{/activity/DBGifReaderByActivityId(activityId=${activity.activityId})}" alt="活動圖片" class="activity-image">

                    <div class="activity-info">
                        <h2 th:text="${activity.activityName}">活動名稱</h2>
                        <p th:text="${activity.activityContent}">活動內容</p>
                        <div class="action-cell">
                            <span class="action-button">
                                查看相關商品
                            </span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <div class="pagination" th:if="${totalPages > 1}">
        <span th:text="'第 ' + ${currentPage} + ' 頁，共 ' + ${totalPages} + ' 頁'"></span>
        <a th:if="${currentPage > 1}"
           th:href="@{'/commodity/mall_listActivityCommodities?page=' + ${currentPage - 1}}">上一頁</a>
        <a th:if="${currentPage < totalPages}"
           th:href="@{'/commodity/mall_listActivityCommodities?page=' + ${currentPage + 1}}">下一頁</a>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
</body>
</html>
