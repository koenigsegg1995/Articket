<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動資訊總攬</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <link rel="icon" href="/images/icon.ico">
    <th:block th:replace="~{fragments/head :: commonCss}"></th:block>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            flex-direction: column;
            min-height: 100vh;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: -10px;
        }

        .col {
            padding: 10px;
            width: 100%;
        }

        .card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-info {
            text-align: center;
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .image-wrapper {
            position: relative;
            padding-top: 75%;
            overflow: hidden;
        }

        .image-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .image-slider img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-title {
            margin: 10px 0;
            font-size: 1.2em;
            font-weight: bold;
        }

        .card-text {
            margin: 5px 0;
            color: #666;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            box-sizing: border-box;
        }

        a {
            color: black;
            text-decoration: none;
        }

        .row.row-cols-1.row-cols-md-3.g-4 {
            margin: 0 0 100px 0;
            justify-content: center;
        }

        #search:hover{
            background-color: #E4D1BA;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #search{
            padding: 0 20px;
            margin: 5px;
            background-color: #E4D1BA;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
            font-size: 16px;
            height: 32px;
        }

        .col-md-12{
            margin-left: 20px;
        }

        @media (min-width: 768px) {
            .row-cols-md-3 > .col {
                width: 300px;
                flex: 0 0 auto;
            }
        }

        @media (max-width: 480px) {
            .col {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-5">
        <h1 style="text-align: center;"><b>活動資訊</b></h1>

        <div class="row mt-3">
            <!-- 地區與類型選擇 -->
            <div class="col-md-12">
                <form method="post" th:action="@{/activity/activitySearch}" th:object="${activityQueryCondition}">
                    <div class="mb-3">
                        <label class="form-label">地區:</label>
                        <div>
                            <label>
                                <input type="checkbox" id="north" th:field="*{venueIdList}" th:value="1"> 北部
                            </label>
                            <label>
                                <input type="checkbox" id="central" th:field="*{venueIdList}" th:value="2"> 中部
                            </label>
                            <label>
                                <input type="checkbox" id="south" th:field="*{venueIdList}" th:value="3"> 南部
                            </label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">類型:</label>
                        <div>
                            <label>
                                <input type="checkbox" id="concert" th:field="*{activityTagList}" th:value="演唱會"> 演唱會
                            </label>
                            <label>
                                <input type="checkbox" id="musical" th:field="*{activityTagList}" th:value="音樂劇"> 音樂劇
                            </label>
                            <label>
                                <input type="checkbox" id="exhibition" th:field="*{activityTagList}" th:value="展覽"> 展覽
                            </label>
                            <label>
                                <input type="checkbox" id="play" th:field="*{activityTagList}" th:value="戲劇"> 戲劇
                            </label>
                            <label>
                                <input type="checkbox" id="dance" th:field="*{activityTagList}" th:value="舞蹈"> 舞蹈
                            </label>
                            <label>
                                <input type="checkbox" id="lecture" th:field="*{activityTagList}" th:value="講座"> 講座
                            </label>
                            <label>
                                <input type="checkbox" id="others" th:field="*{activityTagList}" th:value="其它"> 其它
                            </label>
                            <label>
                                <!-- <span id="searchBar">關鍵字搜尋: <input type="text" name="searchBar" placeholder="例如: IVE"></span> -->
                                <button type="submit" id="search">搜尋</button>
                            </label>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- 活動卡片列表 -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <!-- 針對每個活動生成一個卡片 -->
            <div class="col" th:each="activity : ${activitySearchList}">
                <!-- 設定 overflow: hidden; 確保卡片內的內容不會超出卡片範圍 -->
                <div class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <a th:href="@{activityInfoOne(activityId=${activity.activityId})}"
                           class="text-decoration-none text-dark flex-grow-1 d-flex flex-column">
                            <!-- 設定圖片容器的寬度和 overflow: hidden; 來限制圖片顯示範圍 -->
                            <div class="image-wrapper mb-3" style="height: 200px; overflow: hidden;">
                                <!-- 輪播圖片的容器，設定為flex布局以顯示多張圖片 -->
                                <div class="image-slider" style="display: flex; transition: transform 0.5s ease-in-out;">
                                    <!-- 使用 th:each 遍歷每張圖片並顯示 -->
                                    <img th:each="activityPictureId : ${activity.activityPictureIds}"
                                         th:src="@{|/activity/DBGifReader?activityPictureId=${activityPictureId}|}"
                                         class="img-fluid" alt="Activity Image" 
                                         style="object-fit: cover; width: 100%; height: 200px;">
                                </div>
                            </div>
                            <!-- 顯示活動名稱 -->
                            <div class="card-info">
                                <h5 class="card-title" th:text="${activity.activityName}"></h5>
                                <p class="card-text" th:text="'日期：' + ${#dates.format(activity.activityPostTime, 'yyyy-MM-dd (E)')}"></p>
                                <p class="card-text" th:text="'地點：' + ${activity.venueName}"></p>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script>
        // 輪播圖片區塊
        $(document).ready(function () {
            let currentIndex = 0;
            const images = $('.custom-image');
            const totalImages = images.length;

            setInterval(function () {
                currentIndex = (currentIndex + 1) % totalImages;
                $('.image-slider').css('transform', 'translateX(-' + currentIndex * 100 + '%)');
            }, 3000); // 每3秒切換一次圖片
        });
    </script>
</body>

</html>
